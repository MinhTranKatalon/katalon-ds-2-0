<!-- @dsCard group="Colors" viewport="700x170" name="Semantic" subtitle="Warning, Fail, Slate — status always carries its word" -->
<!doctype html>
<html class="kds-scope">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--k-bg-page)}
  .wrap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .lbl{font-family:var(--k-font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-text-tertiary)}
  .sw{flex:1;min-width:0;height:52px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--k-font-mono);font-size:9.5px}
  
</style>
</head>
<body>
<div class="wrap">
  <span class="lbl">Warning · Fail · Slate</span>
  <div class="row"><span class="sw" style="background:var(--k-warning-100);color:var(--k-text-primary)">warning-100</span><span class="sw" style="background:var(--k-warning-600);color:var(--k-gray-950)">warning-600</span><span class="sw" style="background:var(--k-warning-900);color:#fff">warning-900</span></div>
  <div class="row"><span class="sw" style="background:var(--k-fail-100);color:var(--k-text-primary)">fail-100</span><span class="sw" style="background:var(--k-fail-600);color:#fff">fail-600</span><span class="sw" style="background:var(--k-fail-900);color:#fff">fail-900</span></div>
  <div class="row"><span class="sw" style="background:var(--k-slate-100);color:var(--k-text-primary)">slate-100</span><span class="sw" style="background:var(--k-slate-600);color:#fff">slate-600</span><span class="sw" style="background:var(--k-slate-900);color:#fff">slate-900</span></div>
</div>
</body>
</html>
