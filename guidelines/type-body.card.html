<!-- @dsCard group="Type" viewport="700x170" name="Body · Inter" subtitle="Everything a user reads while working" -->
<!doctype html>
<html class="kds-scope">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--k-bg-page)}
  .wrap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .lbl{font-family:var(--k-font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-text-tertiary)}
  .sw{flex:1;min-width:0;height:52px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--k-font-mono);font-size:9.5px}
  
</style>
</head>
<body>
<div class="wrap">
  <span class="lbl">Inter — var(--k-font-body)</span>
  <span style="font-size:var(--k-fs-body-lg);line-height:var(--k-lh-body-lg);color:var(--k-text-body)">Body large — a lead paragraph or a card intro.</span>
  <span style="font-size:var(--k-fs-body-md);line-height:var(--k-lh-body-md);color:var(--k-text-body)">Body medium — the default. 3 of 49 test cases failed; all three hit the same locator.</span>
  <span style="font-size:var(--k-fs-body-sm);line-height:var(--k-lh-body-sm);color:var(--k-text-secondary)">Body small — secondary detail and helper text.</span>
  <span style="font-size:var(--k-fs-caption);line-height:var(--k-lh-caption);color:var(--k-text-tertiary)">Caption — 12px floor. Never below it.</span>
</div>
</body>
</html>
