<!-- @dsCard group="Brand" viewport="700x160" name="Logo" subtitle="Horizontal is primary · clear space = mark height" -->
<!doctype html>
<html class="kds-scope">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--k-bg-page)}
  .wrap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .lbl{font-family:var(--k-font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-text-tertiary)}
  .sw{flex:1;min-width:0;height:52px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--k-font-mono);font-size:9.5px}
  
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="align-items:center;gap:32px">
    <img src="../assets/logos/katalon-horizontal-rgb.svg" alt="Katalon" style="height:38px">
    <span style="padding:16px 22px;background:var(--k-action-900);border-radius:var(--k-radius-lg)"><img src="../assets/logos/katalon-horizontal-white-green.svg" alt="Katalon" style="height:38px;display:block"></span>
  </div>
  <span style="font-size:13px;color:var(--k-text-secondary)">Minimum 67px wide on screen. Clear space on every side equals the height of the mark. Never re-type a product name beside it — use the lockup.</span>
</div>
</body>
</html>
