<!-- @dsCard group="Colors" viewport="700x170" name="Brand accents" subtitle="Bright, Info/Lilac, Pink — decoration, never a CTA" -->
<!doctype html>
<html class="kds-scope">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--k-bg-page)}
  .wrap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .lbl{font-family:var(--k-font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-text-tertiary)}
  .sw{flex:1;min-width:0;height:52px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--k-font-mono);font-size:9.5px}
  
</style>
</head>
<body>
<div class="wrap">
  <span class="lbl">Bright · Info · Pink — steps 200 / 600 / 800</span>
  <div class="row"><span class="sw" style="background:var(--k-bright-200);color:var(--k-text-primary)">bright-200</span><span class="sw" style="background:var(--k-bright-600);color:#fff">bright-600</span><span class="sw" style="background:var(--k-bright-800);color:#fff">bright-800</span></div>
  <div class="row"><span class="sw" style="background:var(--k-info-200);color:var(--k-text-primary)">info-200</span><span class="sw" style="background:var(--k-info-600);color:#fff">info-600</span><span class="sw" style="background:var(--k-info-800);color:#fff">info-800</span></div>
  <div class="row"><span class="sw" style="background:var(--k-pink-200);color:var(--k-text-primary)">pink-200</span><span class="sw" style="background:var(--k-pink-600);color:#fff">pink-600</span><span class="sw" style="background:var(--k-pink-800);color:#fff">pink-800</span></div>
</div>
</body>
</html>
