<!-- @dsCard group="Brand" viewport="700x150" name="Katalon AI mark" subtitle="Locked asset — swap the file, never filter it" -->
<!doctype html>
<html class="kds-scope">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--k-bg-page)}
  .wrap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .lbl{font-family:var(--k-font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-text-tertiary)}
  .sw{flex:1;min-width:0;height:52px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--k-font-mono);font-size:9.5px}
  
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="align-items:center;gap:28px">
    <img src="../assets/brand-svg/ai-katalon-color.svg" alt="Katalon AI" style="height:44px">
    <span style="padding:14px 20px;background:var(--k-action-600);border-radius:var(--k-radius-lg);display:inline-flex"><img src="../assets/brand-svg/ai-katalon-white.svg" alt="Katalon AI" style="height:44px;display:block"></span>
  </div>
  <span style="font-size:13px;color:var(--k-text-secondary)">Colour on light grounds, white on green, dark or image grounds. Never redrawn, recoloured or rotated. A working agent shows the <strong>moving</strong> mark — a static glyph there is a bug.</span>
</div>
</body>
</html>
