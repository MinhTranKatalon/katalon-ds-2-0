<!doctype html>
<html class="kds-scope">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--k-bg-page)}
  .wrap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .lbl{font-family:var(--k-font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-text-tertiary)}
  .sw{flex:1;min-width:0;height:52px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--k-font-mono);font-size:9.5px}
  
</style>
</head>
<body>
<div class="wrap">
  <span class="lbl">Inter Tight 600 — var(--k-font-display)</span>
  <span style="font-family:var(--k-font-display);font-size:var(--k-fs-display);line-height:var(--k-lh-display);letter-spacing:var(--k-ls-display);font-weight:600;color:var(--k-text-primary)">One platform, one signal</span>
  <span style="font-family:var(--k-font-display);font-size:var(--k-fs-h2);line-height:var(--k-lh-h2);font-weight:600;color:var(--k-text-primary)">Heading two</span>
  <span style="font-family:var(--k-font-display);font-size:var(--k-fs-h4);line-height:var(--k-lh-h4);font-weight:600;color:var(--k-text-primary)">Heading four</span>
</div>
</body>
</html>
