<!-- @dsCard group="Type" viewport="700x110" name="Mono eyebrow" subtitle="The only uppercase text in the system" -->
<!doctype html>
<html class="kds-scope">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--k-bg-page)}
  .wrap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .lbl{font-family:var(--k-font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-text-tertiary)}
  .sw{flex:1;min-width:0;height:52px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--k-font-mono);font-size:9.5px}
  
</style>
</head>
<body>
<div class="wrap">
  <span class="lbl">.kds-eyebrow — 11–13px, .12em tracking</span>
  <span class="kds-eyebrow">Platform review · Q3 FY26</span>
  <span style="font-size:var(--k-fs-body-md);color:var(--k-text-secondary)">Everything else is sentence case — headings, buttons, labels, menu items, table headers.</span>
</div>
</body>
</html>
