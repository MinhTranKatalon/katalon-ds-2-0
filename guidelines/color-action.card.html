<!-- @dsCard group="Colors" viewport="700x120" name="Action · Forest Forward" subtitle="11 steps · primary 600" -->
<!doctype html>
<html class="kds-scope">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--k-bg-page)}
  .wrap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .lbl{font-family:var(--k-font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-text-tertiary)}
  .sw{flex:1;min-width:0;height:52px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--k-font-mono);font-size:9.5px}
  
</style>
</head>
<body>
<div class="wrap">
  <span class="lbl">Action · Forest Forward — var(--k-action-50 … 950)</span>
  <div class="row">
    <span class="sw" style="background:var(--k-action-50);color:var(--k-text-secondary);">50</span>
    <span class="sw" style="background:var(--k-action-100);color:var(--k-text-secondary);">100</span>
    <span class="sw" style="background:var(--k-action-200);color:var(--k-text-secondary);">200</span>
    <span class="sw" style="background:var(--k-action-300);color:var(--k-text-secondary);">300</span>
    <span class="sw" style="background:var(--k-action-400);color:var(--k-text-secondary);">400</span>
    <span class="sw" style="background:var(--k-action-500);color:var(--k-text-secondary);">500</span>
    <span class="sw" style="background:var(--k-action-600);color:#fff;outline:2px solid var(--k-gray-900);outline-offset:2px;">600</span>
    <span class="sw" style="background:var(--k-action-700);color:#fff;">700</span>
    <span class="sw" style="background:var(--k-action-800);color:#fff;">800</span>
    <span class="sw" style="background:var(--k-action-900);color:#fff;">900</span>
    <span class="sw" style="background:var(--k-action-950);color:#fff;">950</span>
  </div>
</div>
</body>
</html>
