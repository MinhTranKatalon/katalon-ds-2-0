<!-- @dsCard group="Spacing" viewport="700x130" name="Space scale" subtitle="4px base · --k-sp-1…10" -->
<!doctype html>
<html class="kds-scope">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--k-bg-page)}
  .wrap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .lbl{font-family:var(--k-font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-text-tertiary)}
  .sw{flex:1;min-width:0;height:52px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--k-font-mono);font-size:9.5px}
  
</style>
</head>
<body>
<div class="wrap">
  <span class="lbl">var(--k-sp-1 … 10)</span>
  <div class="row" style="align-items:flex-end">
    <span style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:var(--k-sp-1);height:36px;background:var(--k-action-600);border-radius:2px"></span><span class="lbl">1</span></span>
    <span style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:var(--k-sp-2);height:36px;background:var(--k-action-600);border-radius:2px"></span><span class="lbl">2</span></span>
    <span style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:var(--k-sp-3);height:36px;background:var(--k-action-600);border-radius:2px"></span><span class="lbl">3</span></span>
    <span style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:var(--k-sp-4);height:36px;background:var(--k-action-600);border-radius:2px"></span><span class="lbl">4</span></span>
    <span style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:var(--k-sp-5);height:36px;background:var(--k-action-600);border-radius:2px"></span><span class="lbl">5</span></span>
    <span style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:var(--k-sp-6);height:36px;background:var(--k-action-600);border-radius:2px"></span><span class="lbl">6</span></span>
    <span style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:var(--k-sp-7);height:36px;background:var(--k-action-600);border-radius:2px"></span><span class="lbl">7</span></span>
    <span style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:var(--k-sp-8);height:36px;background:var(--k-action-600);border-radius:2px"></span><span class="lbl">8</span></span>
    <span style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:var(--k-sp-9);height:36px;background:var(--k-action-600);border-radius:2px"></span><span class="lbl">9</span></span>
    <span style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:var(--k-sp-10);height:36px;background:var(--k-action-600);border-radius:2px"></span><span class="lbl">10</span></span>
  </div>
  <span style="font-size:13px;color:var(--k-text-secondary)">Lay out with flex/grid + gap. Never margin chains.</span>
</div>
</body>
</html>
