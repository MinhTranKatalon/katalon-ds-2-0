<!-- @dsCard group="Colors" viewport="700x110" name="Data visualization" subtitle="Sequential order --k-seq-1…6, used in order" -->
<!doctype html>
<html class="kds-scope">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--k-bg-page)}
  .wrap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .lbl{font-family:var(--k-font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-text-tertiary)}
  .sw{flex:1;min-width:0;height:52px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--k-font-mono);font-size:9.5px}
  
</style>
</head>
<body>
<div class="wrap">
  <span class="lbl">var(--k-seq-1 … 6)</span>
  <div class="row">
    <span class="sw" style="background:var(--k-seq-1);color:#fff">seq-1</span>
    <span class="sw" style="background:var(--k-seq-2);color:#fff">seq-2</span>
    <span class="sw" style="background:var(--k-seq-3);color:#fff">seq-3</span>
    <span class="sw" style="background:var(--k-seq-4);color:#fff">seq-4</span>
    <span class="sw" style="background:var(--k-seq-5);color:#fff">seq-5</span>
    <span class="sw" style="background:var(--k-seq-6);color:#fff">seq-6</span>
  </div>
</div>
</body>
</html>
