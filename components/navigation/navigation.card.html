<!-- @dsCard group="Components" viewport="700x230" name="Navigation" subtitle="Tabs, breadcrumbs, pagination, accordion" -->
<!doctype html>
<html class="kds-scope">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;background:var(--k-bg-page)}
  .wrap{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .lbl{font-family:var(--k-font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-text-tertiary)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
function Demo({ NS }) {
  const { Tabs, Breadcrumbs, Pagination, Accordion } = NS;
  const [tab, setTab] = React.useState('runs');
  const [page, setPage] = React.useState(2);
  return (
    <div className="wrap">
      <Breadcrumbs items={[{ label: 'Projects', href: '#' }, { label: 'Checkout', href: '#' }, { label: 'Login flow' }]} />
      <Tabs label="Suite views" value={tab} onChange={setTab}
        tabs={[{ value: 'overview', label: 'Overview' }, { value: 'runs', label: 'Runs', count: 179 }, { value: 'settings', label: 'Settings' }]} />
      <Pagination page={page} pageCount={30} total={179} pageSize={6} onPage={setPage} />
      <Accordion defaultOpen={['a']} items={[
        { id: 'a', title: 'How is a run counted?', body: 'One execution of one test case, on one browser.' },
        { id: 'b', title: 'What counts as flaky?', body: 'A case that changes result across retries on the same commit.' },
      ]} />
    </div>
  );
}
</script>
<script type="text/babel" data-presets="react">
  // The bundle's namespace name is generated at compile time — find it by shape
  // instead of hard-coding it, so these cards keep working if it changes.
  const NS = Object.keys(window).map(k => { try { return window[k]; } catch (e) { return null; } })
    .find(o => o && typeof o === 'object' && o.Button && o.Card && o.Badge) || {};
  const root = document.getElementById('root');
  if (!NS.Button) {
    root.innerHTML = '<div class="wrap"><span class="lbl">Design system bundle not loaded</span></div>';
  } else {
    ReactDOM.createRoot(root).render(<Demo NS={NS} />);
  }
</script>
</body>
</html>
